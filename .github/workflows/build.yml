name: Build Zero APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create zero_app com.zero.app Zero
          cd zero_app
          cordova platform add android

      - name: Overwrite index.html with our own
        run: |
          # این خط دقیقاً فایل index.html که توی روت گیت‌هاب هست رو برمی‌داره
          cp index.html zero_app/www/index.html
          
          # کپی کردن آیکون
          cp icon.png zero_app/ 2>/dev/null || true

      - name: Build APK
        run: |
          cd zero_app
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zero-APK
          path: zero_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
